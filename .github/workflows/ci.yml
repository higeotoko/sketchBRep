name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev libocct-visualization-dev libocct-ocaf-dev libtbb-dev libfontconfig-dev \
            qt6-base-dev libgl-dev libgl1-mesa-dri xvfb \
            nlohmann-json3-dev libgtest-dev libgmock-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (core, Phase 0 CLI and GUI end-to-end under Xvfb)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" ctest --test-dir build --output-on-failure

  # Windows build + portable zip (exe and all runtime DLLs) for trying the app.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCCT / Qt 6 (conda-forge)
        id: mamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sbr
          create-args: >-
            occt qt6-main nlohmann_json gtest
          cache-environment: true

      # Qt tools (moc) and tests load the environment's DLLs.
      - name: Put environment DLLs on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.mamba.outputs.environment-path }}\Library\bin"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          $env_root = "${{ steps.mamba.outputs.environment-path }}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_PREFIX_PATH="$env_root\Library"

      - name: Build
        run: cmake --build build

      - name: Test (core + Phase 0 CLI)
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.mamba.outputs.environment-path }}\Library\bin;$env:PATH"
          ctest --test-dir build --output-on-failure -LE gui

      - name: Package portable zip
        shell: pwsh
        run: |
          $env_root = "${{ steps.mamba.outputs.environment-path }}"
          $dist = "dist\SketchBRep"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build\src\app\SketchBRep.exe $dist
          Copy-Item build\tools\phase0\sbr_phase0.exe $dist
          # Qt plugins: platform integration (required), styles, image formats.
          foreach ($name in @("platforms", "styles", "imageformats")) {
            $dir = Get-ChildItem -Path $env_root -Recurse -Directory -Filter $name |
                   Where-Object { $_.FullName -match "plugins" } | Select-Object -First 1
            if ($dir) { Copy-Item $dir.FullName "$dist\$name" -Recurse }
          }
          # Only the DLLs actually needed: walk dependencies (dumpbin) from the
          # executables and plugins, resolving names inside the environment.
          $search = @("$env_root\Library\bin", "$env_root")
          $queue = [System.Collections.Generic.Queue[string]]::new()
          Get-ChildItem $dist -Recurse -Include *.exe, *.dll | ForEach-Object { $queue.Enqueue($_.FullName) }
          $seen = @{}
          while ($queue.Count -gt 0) {
            $file = $queue.Dequeue()
            $deps = dumpbin /nologo /dependents $file | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } |
                    ForEach-Object { $_.Trim() }
            foreach ($dep in $deps) {
              $key = $dep.ToLowerInvariant()
              if ($seen.ContainsKey($key)) { continue }
              $seen[$key] = $true
              foreach ($dir in $search) {
                $candidate = Join-Path $dir $dep
                if (Test-Path $candidate) {
                  Copy-Item $candidate $dist
                  $queue.Enqueue((Join-Path $dist $dep))
                  break
                }
              }
            }
          }
          # TBB's allocator is loaded at run time, not linked.
          Get-ChildItem "$env_root\Library\bin" -Filter "tbbmalloc*.dll" | Copy-Item -Destination $dist
          if (-not (Test-Path "$dist\platforms\qwindows.dll")) { throw "qwindows.dll not found" }
          Copy-Item README.md $dist
          Copy-Item docs\images\phase2.png $dist

      - name: Check that every DLL dependency in the zip resolves
        shell: pwsh
        run: |
          $dist = "dist\SketchBRep"
          $missing = @()
          Get-ChildItem $dist -Recurse -Include *.exe, *.dll | ForEach-Object {
            $file = $_
            dumpbin /nologo /dependents $file.FullName | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } |
              ForEach-Object {
                $dep = $_.Trim()
                if ($dep -like "api-ms-win-*" -or $dep -like "ext-ms-*") { return }
                if (Test-Path (Join-Path $dist $dep)) { return }
                # The VC++ runtime is present on the runner but not on every PC:
                # it must ship in the zip.
                $runtime = $dep -like "vcruntime*" -or $dep -like "msvcp*" -or $dep -like "concrt*"
                if (-not $runtime -and (Test-Path (Join-Path "C:\Windows\System32" $dep))) { return }
                $missing += "$($file.Name) -> $dep"
              }
          }
          if ($missing.Count -gt 0) { $missing | ForEach-Object { Write-Host $_ }; throw "missing DLLs" }
          $size = (Get-ChildItem $dist -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Package size: {0:N0} MB" -f $size)

      - name: Smoke test packaged app (headless Phase 0 CLI from the zip folder)
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32"
          dist\SketchBRep\sbr_phase0.exe 1000 2000 3000 dist\box.step

      - uses: actions/upload-artifact@v4
        with:
          name: SketchBRep-windows-x64
          path: dist/SketchBRep
          retention-days: 30
